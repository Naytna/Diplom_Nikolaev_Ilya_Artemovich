services:
  postgres:
    image: postgres:17-alpine
    container_name: rsl_learning_postgres
    environment:
      POSTGRES_DB: rsl_learning
      POSTGRES_USER: rsl_user
      POSTGRES_PASSWORD: rsl_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsl_user -d rsl_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: rsl_learning_backend
    environment:
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: rsl_user
      DB_PASSWORD: rsl_password
      DB_NAME: rsl_learning
      DB_SSLMODE: disable
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24-slim
    container_name: rsl_learning_web
    working_dir: /app/web
    command: sh -lc "npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app/web
    depends_on:
      - backend

volumes:
  postgres_data: